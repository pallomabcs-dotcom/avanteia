<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avante IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --laranja: #E74F39;
      --navy: #161B32;
      --fundo: #F7F7FA;
      --texto: #161B32;
      --suave: #5B6075;
      --cartao: #FFFFFF;
      --borda: #E2E4EC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0E1122;
        --texto: #F2F3F7;
        --suave: #A9ADBF;
        --cartao: #161B32;
        --borda: #2A3050;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Poppins", system-ui, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--cartao);
      border: 1px solid var(--borda);
      border-top: 6px solid var(--laranja);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 700;
    }
    h1 span { color: var(--laranja); }
    p { margin: 0 0 28px; color: var(--suave); }
    label {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 1.05rem;
    }
    form { display: flex; flex-direction: column; gap: 12px; }
    input {
      font: inherit;
      padding: 12px 16px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: transparent;
      color: inherit;
    }
    input:focus { outline: 2px solid var(--laranja); outline-offset: 1px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--laranja);
      color: #fff;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    #saudacao { margin: 24px 0 0; font-size: 1.15rem; color: var(--texto); }
    #saudacao strong { color: var(--laranja); }
  </style>
</head>
<body>
  <main>
    <h1>Boas-vindas à <span>Avante IA</span>!</h1>
    <p>Que bom ter você por aqui.</p>

    <form id="form-nome">
      <label for="nome">Qual é o seu nome?</label>
      <input id="nome" name="nome" type="text" placeholder="Digite seu nome" autocomplete="given-name" required>
      <button type="submit">Continuar</button>
    </form>

    <p id="saudacao" hidden></p>
  </main>

  <script>
    const form = document.getElementById("form-nome");
    const saudacao = document.getElementById("saudacao");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const nome = document.getElementById("nome").value.trim();
      if (!nome) return;
      saudacao.textContent = "";
      saudacao.append("Olá, ");
      const destaque = document.createElement("strong");
      destaque.textContent = nome;
      saudacao.append(destaque, "! Vamos começar?");
      saudacao.hidden = false;
    });
  </script>
</body>
</html>
